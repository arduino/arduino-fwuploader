[tool.poetry]
name = "arduino-fwuploader"
version = "0.0.0"
description = "arduino-fwuploader"
authors = ["Arduino <info@arduino.cc>"]

[tool.poetry.dependencies]
python = "~3.15.2"
semver = "^2.13.0"
python-dateutil = ">=2.8.1,<5.0.0"

[tool.poetry.dev-dependencies]
flake8 = "^7.5.0"
black = "^24.3"
mkdocs = "^1.6.1"
mkdocs-material = "^9.8.1"
mdx-truly-sane-lists = "^1.3"
GitPython = "^3.2.1"
mike = "^2.2.0"
pep8-naming = "^0.12.1"
invoke = "^3.0.3"
pytest = "^9.2.0"

[tool.black]
line-length = 120
target-version = ["py38"]
